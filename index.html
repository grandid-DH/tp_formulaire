<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Formulaire d'inscription</title>
</head>
<body>
    <div class="container mt-5">
        <legend>Identité</legend>
    <form>
        <div class="mb-3">
            <div class="form-check form-check-inline">
                <label class="form-check-label" for="radioHomme">Homme</label>
                <input class="form-check-input" type="radio" name="radioDefault" id="radioHomme" ckecked>
            </div>
            <div class="form-check form-check-inline">
                <label class="form-check-label" for="radioFemme">Femme</label>
                <input class="form-check-input" type="radio" name="radioDefault" id="radioFemme">
            </div>
        </div>
        <div class="mb-3">
            <label for="nom">Votre nom :</label>
            <input class="form-control" type="text" id="nom" name="nom">
        </div>
        <div class="mb-3">
            <label for="email">Votre adresse mail :</label>
            <input class="form-control" type="email" id="email" name="email">
        </div>
        <div class="mb-5">
            <label for="nom">Votre message :</label>
            <textarea class="form-control" name="message" id="message" ></textarea>
        </div>
        <div class="mb-5">
            <label for="pays">Votre pays :</label>
            <select name="pays">
                <option value="fr">France</option>
                <option value="be">Belgique</option>
                <option value="it">Italie</option>
            </select>
        </div>
        <button>Envoyer</button>
    </form>
    </div>  
</body>
</html>
